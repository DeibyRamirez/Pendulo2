<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .fondo { fill: #000000; }
      .trazo { stroke: #ffffff; }
      .bola { fill: #ffffff; }
    }
    @media (prefers-color-scheme: dark) {
      .fondo { fill: #ffffff; }
      .trazo { stroke: #000000; }
      .bola { fill: #000000; }
    }
  </style>
  <rect class="fondo" width="180" height="180" rx="37" />
  <g class="trazo" stroke-width="12" stroke-linecap="round" fill="none">
    <circle cx="90" cy="34" r="13" />
    <line x1="90" y1="49" x2="90" y2="116" />
  </g>
  <circle class="bola" cx="90" cy="134" r="21" />
</svg>
